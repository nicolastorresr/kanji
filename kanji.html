const $=id=>document.getElementById(id);
const grp=()=>cur=="all"?D:D.filter(d=>d.l==cur);
const lvName=l=>l=="S"?"Secundaria":"Primaria "+l+"º";
function render(){
 $("nav").innerHTML=LV.map(([v,t])=>`<button class="f ${v==cur?"on":""}" data-v="${v}">${t}</button>`).join("");
 document.querySelectorAll(".f").forEach(b=>b.onclick=()=>{cur=b.dataset.v;render()});
 const g=grp();
 $("qb").textContent="Quiz rápido · "+LV.find(x=>x[0]==cur)[1];
 $("cnt").textContent=g.length+" kanji";
 $("grid").innerHTML=g.map(d=>`<div class="c"><div class="in"><div class="s fr"><div><b>${d.k}</b><small>${d.m}</small></div></div>
 <div class="s bk"><span class="k">${d.k}</span><p><b>${d.m}</b></p><p><span class="jp-reading">${d.r}</span><br><i>${d.ro}</i></p><hr style="border:0;border-top:1px solid var(--line)">
 <p><span class="jp-example">${d.j}</span><br><i>${d.jr}</i><br>${d.e}</p></div></div></div>`).join("");
 document.querySelectorAll(".c").forEach(c=>c.onclick=()=>c.classList.toggle("fl"));
}
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const rd=r=>r.split('・').map((p,n)=>n?p:p.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96))).join('・');
let Q=[],i=0,sc=0;
$("qb").onclick=()=>{Q=shuf(grp()).slice(0,10);i=0;sc=0;$("home").hidden=true;$("quiz").hidden=false;ask()};
function ask(){
 const q=Q[i];
 const ms=[...new Set(D.map(d=>d.m))].filter(m=>m!=q.m);
 const opts=shuf([q.m,...shuf(ms).slice(0,3)]);
 $("quiz").innerHTML=`<div class="cnt">Pregunta ${i+1} de ${Q.length}</div><div class="big">${q.k}</div><div class="cnt" style="font-size:1.2rem">${rd(q.r)}</div><p>¿Qué significa?</p>`+
 opts.map(o=>`<button class="o">${o}</button>`).join("")+`<div class="msg" id="msg"></div><button class="q" id="nx" hidden>Siguiente</button>`;
 document.querySelectorAll(".o").forEach(b=>b.onclick=()=>{
  const ok=b.textContent==q.m;if(ok)sc++;
  document.querySelectorAll(".o").forEach(x=>{x.disabled=true;if(x.textContent==q.m)x.classList.add("ok")});
  if(!ok)b.classList.add("bad");
  $("msg").textContent=ok?"✔ ¡Correcto!":"✘ Incorrecto. Respuesta correcta: "+q.m;
  $("msg").style.color=ok?"var(--ok)":"var(--bad)";
  $("nx").hidden=false;$("nx").textContent=i+1<Q.length?"Siguiente":"Ver puntaje";
  $("nx").onclick=()=>{i++;i<Q.length?ask():end()};
 });
}
function end(){
 $("quiz").innerHTML=`<div class="sun">${sc}</div><h2>Puntaje: ${sc} / ${Q.length}</h2><button class="q" id="bk">Volver a las tarjetas</button>`;
 $("bk").onclick=()=>{$("quiz").hidden=true;$("home").hidden=false;render()};
}
render();
</script></body></html>
